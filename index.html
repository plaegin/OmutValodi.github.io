<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Омут Валоди</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      padding: 2rem;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      text-align: center;
    }

    .friends {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
    }

    .friend {
      text-align: center;
      width: 150px;
    }

    .friend img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #aaa;
      transition: transform 0.2s;
    }

    .friend img:hover {
      transform: scale(1.05);
    }

    .friend a {
      display: block;
      margin-top: 0.5rem;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    .friend a:hover {
      color: #0077cc;
    }

    footer {
      margin-top: 2rem;
      padding: 1rem;
      border-top: 1px solid #ccc;
      width: 100%;
      text-align: center;
      background-color: #fff;
    }

    .footer-links a {
      margin: 0 1rem;
      text-decoration: none;
      color: #555;
      font-weight: 500;
    }

    .footer-links a:hover {
      color: #0077cc;
    }

    /* Адаптивность под мобильные устройства */
    @media (max-width: 600px) {
      header {
        font-size: 1.5rem;
        padding: 1rem;
      }

      .friend {
        width: 120px;
      }

      .friend img {
        width: 120px;
        height: 120px;
      }

      .footer-links a {
        display: block;
        margin: 0.5rem 0;
      }

      .footer-links {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <header>
    Омут Валоди
  </header>

  <section class="friends">
    <div class="friend">
      <a href="Personal Pages/NikDan/NikDan.html">
        <img src="Images/nikdan.png" alt="НикДан">
        <span>НикДан</span>
      </a>
    </div>
    <div class="friend">
      <a href="Personal Pages/An-Ha/An-Ha.html">
        <img src="Images/an-ha.png" alt="Андрюха">
        <span>Андрюха</span>
      </a>
    </div>
    <div class="friend">
        <img src="Images/tyoma.png" alt="Тёма">
        <span>Тёма</span>
      </a>
    </div>
    <div class="friend">
        <img src="Images/nikich.png" alt="Никич">
        <span>Никич</span>
      </a>
    </div>
    <div class="friend">
        <img src="Images/alexey.png" alt="Лёха">
        <span>Лёха</span>
      </a>
    </div>
  </section>

  <footer>
    <div class="footer-links">
      <a href="Pages/Films/films.html">Фильмография</a>
      <a href="Pages/Music/music.html">Музыка</a>
      <a href="Pages/Events/events.html">События</a>
    </div>
  </footer>
</body>
</html>
