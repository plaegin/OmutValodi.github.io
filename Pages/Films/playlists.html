<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фильмография Омута</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      padding: 2rem;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      text-align: center;
    }

    .films {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
    }

    .film {
      text-align: center;
      width: 150px;
    }

    .film img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #aaa;
      transition: transform 0.2s;
    }

    .film img:hover {
      transform: scale(1.05);
    }

    .film a {
      display: block;
      margin-top: 0.5rem;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    .film a:hover {
      color: #0077cc;
    }

    footer {
      margin-top: 2rem;
      padding: 1rem;
      border-top: 1px solid #ccc;
      width: 100%;
      text-align: center;
      background-color: #fff;
    }

    .footer-links a {
      margin: 0 1rem;
      text-decoration: none;
      color: #555;
      font-weight: 500;
    }

    .footer-links a:hover {
      color: #0077cc;
    }

    /* Адаптивность под мобильные устройства */
    @media (max-width: 600px) {
      header {
        font-size: 1.5rem;
        padding: 1rem;
      }

      .film {
        width: 120px;
      }

      .film img {
        width: 120px;
        height: 120px;
      }

      .footer-links a {
        display: block;
        margin: 0.5rem 0;
      }

      .footer-links {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <header>
    Фильмография Омута
  </header>

  <section class="films">
    <div class="film">
      <a href="Playlists/allVideos.html">
        <img src="Images/p1.png" alt="Вся фильмография Омута">
        <span>Вся Фильмография Омута</span>
      </a>
    </div>
    
	<div class="film">
      <a href="Playlists/FindingAlexey.html">
        <img src="Images/p2.png" alt="Вселенная Поисков Лёхи">
        <span>Вселенная "Поисков Лёхи"</span>
      </a>
    </div>
	
	<div class="film">
      <a href="Playlists/MGR.html">
        <img src="Images/p3.png" alt="МГР по версии Омута">
        <span>МГР по версии Омута</span>
      </a>
    </div>
	
	<div class="film">
      <a href="Playlists/AntonEgo.html">
        <img src="Images/p4.png" alt="Отзывы Антона Эго">
        <span>Отзывы Антона Эго</span>
      </a>
    </div>
	
	<div class="film">
      <a href="Playlists/CoolStory.html">
        <img src="Images/p5.png" alt="КулСтори">
        <span>КулСтори</span>
      </a>
    </div>
	
	<div class="film">
      <a href="Playlists/CriminalScum.html">
        <img src="Images/p6.png" alt="Криминал Скам">
        <span>Криминал Скам</span>
      </a>
    </div>
	
	<div class="film">
      <a href="Playlists/RGM.html">
        <img src="Images/p7.png" alt="атумО иисрев оп РГМ">
        <span>атумО иисрев оп РГМ</span>
      </a>
    </div>

  </section>

</body>
</html>
